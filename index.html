<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish Content - LeakStream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .publish-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 1.1rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
            display: block;
        }

        .hoster-links {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .hoster-link {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            font-weight: bold;
        }

        .hoster-link:hover {
            background: #764ba2;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: #45a049;
        }

        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="publish-container">
        <h1>📤 Publish Content</h1>
        
        <form id="publishForm">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" required maxlength="100" placeholder="Enter a descriptive title">
            </div>
            
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" required maxlength="500" placeholder="Describe your content"></textarea>
            </div>
            
            <div class="form-group">
                <label for="type">Content Type *</label>
                <select id="type" required>
                    <option value="">Select type</option>
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                    <option value="link">Link</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="link">Direct Link *</label>
                <input type="url" id="link" required placeholder="https://example.com/path/to/content">
                <span class="upload-hint">Paste the direct link to your content here</span>
                
                <div class="hoster-links">
                    <a href="https://imagekit.io/dashboard/media-library" target="_blank" class="hoster-link">
                        Upload Videos/Images
                    </a>
                    <a href="https://imgbb.com/" target="_blank" class="hoster-link">
                        Upload Images
                    </a>
                </div>
                
                <span class="upload-hint">
                    Note: Upload your content to one of the hosters above, then paste the direct link here
                </span>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Publish Content</button>
        </form>
        
        <div id="statusMessage" class="status-message"></div>
        <a href="index.html" class="back-link">← Back to Viewer</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAyTSyWhLVe22jynP94cp9OEg6IC5-OhdE",
            authDomain: "leakstream-4f62f.firebaseapp.com",
            projectId: "leakstream-4f62f",
            storageBucket: "leakstream-4f62f.firebasestorage.app",
            messagingSenderId: "886997714546",
            appId: "1:886997714546:web:b7fcbb9b28010d5ec564eb",
            measurementId: "G-RXHE019ZWT"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Check for user timeout
        function checkTimeout() {
            const timeoutEnd = localStorage.getItem('timeoutEnd');
            if (timeoutEnd && Date.now() < parseInt(timeoutEnd)) {
                window.location.href = 'index.html';
                return true;
            }
            return false;
        }

        // Spam detection
        async function checkSpam(userId, link) {
            try {
                // Check for duplicate links in last 24 hours
                const duplicatePosts = await db.collection('posts')
                    .where('userId', '==', userId)
                    .where('link', '==', link)
                    .where('timestamp', '>', new Date(Date.now() - 24 * 60 * 60 * 1000))
                    .get();
                
                if (duplicatePosts.size >= 5) {
                    return {
                        isSpam: true,
                        reason: 'Duplicate content posted 5+ times'
                    };
                }
                
                // Check user's posting frequency
                const recentPosts = await db.collection('posts')
                    .where('userId', '==', userId)
                    .where('timestamp', '>', new Date(Date.now() - 60 * 60 * 1000)) // Last hour
                    .get();
                
                if (recentPosts.size >= 10) {
                    return {
                        isSpam: true,
                        reason: 'Posting too frequently (10+ posts/hour)'
                    };
                }
                
                return { isSpam: false };
            } catch (error) {
                console.error('Error checking spam:', error);
                return { isSpam: false };
            }
        }

        // Initialize app
        async function initializeApp() {
            if (checkTimeout()) return;
            
            try {
                // Sign in anonymously
                await auth.signInAnonymously();
                setupForm();
            } catch (error) {
                console.error('Authentication error:', error);
                showStatus('Error connecting to database', 'error');
            }
        }

        // Setup form submission
        function setupForm() {
            const form = document.getElementById('publishForm');
            const submitBtn = document.getElementById('submitBtn');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const type = document.getElementById('type').value;
                const link = document.getElementById('link').value.trim();
                
                if (!title || !description || !type || !link) {
                    showStatus('Please fill in all fields', 'error');
                    return;
                }
                
                // Validate URL
                try {
                    new URL(link);
                } catch {
                    showStatus('Please enter a valid URL', 'error');
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Publishing...';
                
                try {
                    const user = auth.currentUser;
                    
                    // Check for spam
                    const spamCheck = await checkSpam(user.uid, link);
                    if (spamCheck.isSpam) {
                        showStatus(`Spam detected: ${spamCheck.reason}. Post blocked.`, 'error');
                        
                        // Apply timeout for repeated spam
                        if (spamCheck.reason.includes('5+ times')) {
                            localStorage.setItem('timeoutEnd', Date.now() + (24 * 60 * 60 * 1000));
                        }
                        
                        return;
                    }
                    
                    // Create post
                    await db.collection('posts').add({
                        title: title,
                        description: description,
                        type: type,
                        link: link,
                        userId: user.uid,
                        spamReports: 0,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Show success message
                    showStatus('Content published successfully! It will appear on the main site shortly.', 'success');
                    
                    // Reset form
                    form.reset();
                    
                } catch (error) {
                    console.error('Error publishing:', error);
                    showStatus('Error publishing content. Please try again.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish Content';
                }
            });
        }

        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
            statusDiv.style.display = 'block';
            
            // Auto-hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }

        // Initialize on load
        window.addEventListener('load', initializeApp);
    </script>
</body>
</html>
