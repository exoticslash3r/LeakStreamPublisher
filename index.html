<!-- publisher/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>LeakStream Publisher</title>
    <style>
        .publish-form {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        .hosting-links {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .host-btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="publish-form">
        <h1>Publish Content</h1>
        
        <input type="text" id="title" placeholder="Title" maxlength="200">
        <textarea id="description" placeholder="Description" rows="4" maxlength="1000"></textarea>
        
        <select id="contentType">
            <option value="video">Video</option>
            <option value="image">Image</option>
            <option value="link">Link</option>
        </select>
        
        <input type="url" id="contentUrl" placeholder="Paste your URL here">
        
        <div class="hosting-links">
            <button class="host-btn" onclick="window.open('https://imagekit.io/dashboard/media-library')">
                Upload Video
            </button>
            <button class="host-btn" onclick="window.open('https://imgbb.com/')">
                Upload Image
            </button>
        </div>
        
        <button onclick="publishContent()">Publish</button>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        // Initialize Firebase (same config)
        
        async function publishContent() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const contentType = document.getElementById('contentType').value;
            const contentUrl = document.getElementById('contentUrl').value;
            
            // Generate keywords for search
            const keywords = generateKeywords(title + ' ' + description);
            
            try {
                await addDoc(collection(db, 'posts'), {
                    title,
                    description,
                    contentType,
                    contentUrl,
                    keywords,
                    timestamp: serverTimestamp(),
                    userId: auth.currentUser?.uid || 'anonymous',
                    reports: 0,
                    isSpam: false
                });
                
                alert('Published successfully!');
                clearForm();
            } catch (error) {
                console.error('Error publishing:', error);
                alert('Error publishing content');
            }
        }
        
        function generateKeywords(text) {
            const words = text.toLowerCase().split(' ');
            const stopWords = ['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with'];
            return [...new Set(words.filter(word => 
                word.length > 2 && !stopWords.includes(word)
            ))];
        }
    </script>
</body>
</html>
