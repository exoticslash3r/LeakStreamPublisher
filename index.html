<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeakStream - Publisher</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .publisher-container {
            width: 100%;
            max-width: 600px;
            border: 1px solid #333;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #fff;
        }

        .hosting-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .host-btn {
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .host-btn:hover {
            background: #222;
            border-color: #fff;
        }

        .host-icon {
            font-size: 20px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #fff;
            background: #000;
            color: #fff;
            font-size: 14px;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-back {
            background: #111;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            display: none;
            border: 1px solid;
            font-size: 14px;
        }

        .status.success {
            border-color: #0f0;
            color: #0f0;
            display: block;
        }

        .status.error {
            border-color: #f00;
            color: #f00;
            display: block;
        }

        .status.info {
            border-color: #ccc;
            color: #ccc;
            display: block;
        }

        .spam-warning {
            color: #f00;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .preview-container {
            margin: 20px 0;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        .preview-title {
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }

        .preview-content {
            max-width: 100%;
            max-height: 250px;
            display: block;
            margin: 0 auto;
        }

        .post-count {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 768px) {
            .publisher-container {
                padding: 20px;
            }
            
            .hosting-links {
                grid-template-columns: 1fr;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="publisher-container">
        <h1>PUBLISH CONTENT</h1>
        
        <form id="publishForm">
            <div class="form-group">
                <label for="title">TITLE</label>
                <input type="text" id="title" required maxlength="200" placeholder="Enter title">
            </div>
            
            <div class="form-group">
                <label for="description">DESCRIPTION</label>
                <textarea id="description" maxlength="1000" placeholder="Enter description (optional)"></textarea>
            </div>
            
            <div class="form-group">
                <label for="contentType">CONTENT TYPE</label>
                <select id="contentType">
                    <option value="video">VIDEO</option>
                    <option value="image">IMAGE</option>
                    <option value="link">LINK</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="url">MEDIA URL</label>
                <input type="url" id="url" required placeholder="https://example.com/media.mp4">
            </div>
            
            <div class="hosting-links">
                <a href="https://imagekit.io/dashboard/media-library" target="_blank" class="host-btn">
                    <span class="host-icon">📹</span>
                    <span>Upload Video</span>
                </a>
                <a href="https://imgbb.com/" target="_blank" class="host-btn">
                    <span class="host-icon">🖼️</span>
                    <span>Upload Image</span>
                </a>
            </div>
            
            <div class="preview-container" id="previewContainer">
                <div class="preview-title">PREVIEW</div>
                <div id="previewContent"></div>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-back" onclick="window.location.href='index.html'">
                    ← BACK
                </button>
                <button type="button" class="btn" onclick="publishContent()">
                    PUBLISH
                </button>
            </div>
        </form>
        
        <div class="status" id="statusMessage"></div>
        <div class="spam-warning" id="spamWarning">⚠ DAILY LIMIT APPROACHING</div>
        <div class="post-count" id="postCount">Posts today: 0/5</div>
    </div>

    <script>
        // ========== FIREBASE CONFIGURATION ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAyTSyWhLVe22jynP94cp9OEg6IC5-OhdE",
            authDomain: "leakstream-4f62f.firebaseapp.com",
            projectId: "leakstream-4f62f",
            storageBucket: "leakstream-4f62f.firebasestorage.app",
            messagingSenderId: "886997714546",
            appId: "1:886997714546:web:b7fcbb9b28010d5ec564eb",
            measurementId: "G-RXHE019ZWT"
        };

        // ========== FIREBASE INITIALIZATION ==========
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ========== GLOBAL VARIABLES ==========
        const MAX_POSTS_PER_DAY = 5;
        let userPostCount = 0;

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize auth
            auth.signInAnonymously()
                .then(() => {
                    checkDailyPostCount();
                    setupPreview();
                    setupFormValidation();
                })
                .catch(error => {
                    console.error('Auth error:', error);
                    checkDailyPostCount(); // Check count anyway
                });
        });

        // ========== POST COUNT MANAGEMENT ==========
        function checkDailyPostCount() {
            const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
            const userId = auth.currentUser?.uid || 'anonymous';
            const storageKey = `postCount_${userId}_${today}`;
            
            // Get count from localStorage
            const stored = localStorage.getItem(storageKey);
            userPostCount = stored ? parseInt(stored) : 0;
            
            // Update display
            updatePostCountDisplay();
            
            // Check if user is at or near limit
            if (userPostCount >= MAX_POSTS_PER_DAY) {
                disablePublishing();
            } else if (userPostCount >= MAX_POSTS_PER_DAY - 1) {
                showSpamWarning();
            }
        }

        function updatePostCountDisplay() {
            document.getElementById('postCount').textContent = `Posts today: ${userPostCount}/${MAX_POSTS_PER_DAY}`;
        }

        function incrementPostCount() {
            const today = new Date().toISOString().split('T')[0];
            const userId = auth.currentUser?.uid || 'anonymous';
            const storageKey = `postCount_${userId}_${today}`;
            
            userPostCount++;
            localStorage.setItem(storageKey, userPostCount.toString());
            
            updatePostCountDisplay();
            
            if (userPostCount >= MAX_POSTS_PER_DAY) {
                disablePublishing();
                showStatus('Daily posting limit reached. Try again tomorrow.', 'error');
            } else if (userPostCount >= MAX_POSTS_PER_DAY - 1) {
                showSpamWarning();
            }
        }

        function disablePublishing() {
            document.getElementById('publishForm').style.opacity = '0.5';
            document.getElementById('publishForm').style.pointerEvents = 'none';
            document.getElementById('spamWarning').style.display = 'none';
        }

        function showSpamWarning() {
            document.getElementById('spamWarning').style.display = 'block';
        }

        // ========== PREVIEW SYSTEM ==========
        function setupPreview() {
            const urlInput = document.getElementById('url');
            const contentTypeSelect = document.getElementById('contentType');
            
            function updatePreview() {
                const url = urlInput.value.trim();
                const contentType = contentTypeSelect.value;
                const previewContainer = document.getElementById('previewContainer');
                const previewContent = document.getElementById('previewContent');
                
                if (!url) {
                    previewContainer.classList.remove('active');
                    return;
                }
                
                try {
                    // Validate URL
                    new URL(url);
                    
                    let previewHtml = '';
                    
                    if (contentType === 'video' || url.match(/\.(mp4|webm|mov|avi|mkv)$/i)) {
                        previewHtml = `
                            <video class="preview-content" controls style="width:100%; max-height:200px;">
                                <source src="${url}" type="video/mp4">
                                Your browser does not support video preview.
                            </video>
                        `;
                    } else if (contentType === 'image' || url.match(/\.(jpg|jpeg|png|gif|webp|bmp)$/i)) {
                        previewHtml = `
                            <img class="preview-content" src="${url}" alt="Preview" style="max-width:100%; max-height:200px;">
                        `;
                    } else {
                        previewHtml = `
                            <div style="padding: 20px; text-align: center; color: #ccc;">
                                Link: ${url.substring(0, 50)}${url.length > 50 ? '...' : ''}
                            </div>
                        `;
                    }
                    
                    previewContent.innerHTML = previewHtml;
                    previewContainer.classList.add('active');
                } catch (error) {
                    previewContainer.classList.remove('active');
                }
            }
            
            urlInput.addEventListener('input', updatePreview);
            contentTypeSelect.addEventListener('change', updatePreview);
        }

        // ========== FORM VALIDATION ==========
        function setupFormValidation() {
            const form = document.getElementById('publishForm');
            const urlInput = document.getElementById('url');
            
            urlInput.addEventListener('blur', function() {
                const url = this.value.trim();
                if (url) {
                    try {
                        new URL(url);
                        this.style.borderColor = '#333';
                    } catch (error) {
                        this.style.borderColor = '#f00';
                        showStatus('Invalid URL format', 'error');
                    }
                }
            });
        }

        // ========== PUBLISH FUNCTION ==========
        async function publishContent() {
            // Check post limit
            if (userPostCount >= MAX_POSTS_PER_DAY) {
                showStatus('Daily posting limit reached', 'error');
                return;
            }
            
            // Get form values
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const contentType = document.getElementById('contentType').value;
            const url = document.getElementById('url').value.trim();
            
            // Validate required fields
            if (!title) {
                showStatus('Title is required', 'error');
                return;
            }
            
            if (!url) {
                showStatus('URL is required', 'error');
                return;
            }
            
            // Validate URL format
            try {
                new URL(url);
            } catch (error) {
                showStatus('Invalid URL format', 'error');
                return;
            }
            
            // Validate URL length
            if (url.length > 2000) {
                showStatus('URL is too long', 'error');
                return;
            }
            
            // Show loading status
            showStatus('Publishing...', 'info');
            
            try {
                // Generate keywords for search
                const keywords = generateKeywords(title + ' ' + description);
                
                // Prepare data
                const postData = {
                    title: title,
                    description: description,
                    type: contentType,
                    url: url,
                    title_lowercase: title.toLowerCase(),
                    description_lowercase: description.toLowerCase(),
                    keywords: keywords,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    userId: auth.currentUser?.uid || 'anonymous',
                    ip: 'unknown', // Note: IP can't be reliably obtained client-side
                    reports: 0,
                    views: 0,
                    downloads: 0
                };
                
                // Save to Firestore
                const docRef = await db.collection('posts').add(postData);
                
                // Update post count
                incrementPostCount();
                
                // Show success with sound alert
                showStatus('Content published successfully!', 'success');
                playSuccessSound();
                
                // Reset form
                document.getElementById('publishForm').reset();
                document.getElementById('previewContainer').classList.remove('active');
                
                // Auto-hide success message after 5 seconds
                setTimeout(() => {
                    document.getElementById('statusMessage').style.display = 'none';
                }, 5000);
                
            } catch (error) {
                console.error('Publish error:', error);
                showStatus('Error publishing content. Please try again.', 'error');
            }
        }

        function generateKeywords(text) {
            // Convert to lowercase and split
            const words = text.toLowerCase()
                .replace(/[^\w\s]/g, ' ') // Remove special chars
                .split(/\s+/) // Split by whitespace
                .filter(word => word.length > 2); // Remove short words
            
            // Common stop words to remove
            const stopWords = ['the', 'and', 'for', 'you', 'with', 'that', 'this', 'from', 'have', 'what'];
            
            // Filter out stop words and duplicates
            const filteredWords = words.filter(word => 
                !stopWords.includes(word) && word.length > 2
            );
            
            // Return unique words, limited to 20
            return [...new Set(filteredWords)].slice(0, 20);
        }

        function playSuccessSound() {
            try {
                // Create a simple beep sound
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
                
                // Also show browser notification if supported
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('Content Published', {
                        body: 'Your content has been published successfully!',
                        icon: 'https://i.postimg.cc/W1Jg7yv0/leakstream-removebg-preview.png'
                    });
                }
            } catch (error) {
                // Sound is optional, just ignore errors
            }
        }

        // ========== STATUS MESSAGES ==========
        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = 'status';
            
            if (type === 'success') {
                status.classList.add('success');
            } else if (type === 'error') {
                status.classList.add('error');
            } else if (type === 'info') {
                status.classList.add('info');
            }
            
            status.style.display = 'block';
        }

        // ========== GLOBAL FUNCTION ==========
        window.publishContent = publishContent;
    </script>
</body>
</html>
